<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>NØRA Login</title><link rel="icon" href="/favicon.png"><link rel="stylesheet" href="/styles.css"></head><body class="login-body"><div class="login-shell"><div class="login-card"><div class="login-brand"><img src="/logo.png" alt="NØRA Logo"><h1>NØRA</h1><p>Control your flow.</p></div><form id="login-form" class="form-stack"><input class="input" name="username" placeholder="Benutzername" autocomplete="username" required><input class="input" name="password" type="password" placeholder="Passwort" autocomplete="current-password" required><div id="login-error" class="login-error"></div><button class="btn btn-primary" type="submit">Einloggen</button></form><p class="small" style="margin-top:16px;text-align:center">Standard: <strong>admin</strong> / <strong>bitte-sofort-aendern-123</strong></p></div></div><script>fetch('/api/me').then(r=>r.json()).then(d=>{ if(d.authenticated) location.href='/app'; });document.getElementById('login-form').addEventListener('submit', async (e)=>{e.preventDefault();const form = new FormData(e.target);const res = await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(form))});const data = await res.json();if(!res.ok){ document.getElementById('login-error').textContent = data.error || 'Login fehlgeschlagen'; return; }location.href='/app';});</script></body></html>
