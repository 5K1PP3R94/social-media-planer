<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>NØRA Login</title><link rel="icon" href="/favicon.png"><link rel="stylesheet" href="/styles.css"></head><body class="login-body"><div class="login-shell"><div class="login-card"><div class="login-brand"><img src="/logo.png" alt="NØRA Logo"><h1>NØRA</h1><p>Control your flow.</p></div><form id="login-form" class="form-stack"><input class="input" name="username" placeholder="Benutzername" autocomplete="username" required><input class="input" name="password" type="password" placeholder="Passwort" autocomplete="current-password" required><div id="login-error" class="login-error"></div><button class="btn btn-primary" type="submit">Einloggen</button></form><p class="small" style="margin-top:16px;text-align:center">Standard: <strong>admin</strong> / <strong>bitte-sofort-aendern-123</strong></p></div></div><script>fetch('/api/me', {credentials:'same-origin'}).then(r=>r.json()).then(d=>{ if(d.authenticated) location.href='/app'; }).catch(()=>{});document.getElementById('login-form').addEventListener('submit', async (e)=>{e.preventDefault();const form = new FormData(e.target);const errorEl = document.getElementById('login-error'); errorEl.textContent=''; const submitBtn = e.target.querySelector('button[type="submit"]'); submitBtn.disabled = true; submitBtn.textContent='Einloggen…'; try { const res = await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(Object.fromEntries(form))}); const data = await res.json().catch(()=>({})); if(!res.ok){ errorEl.textContent = data.error || 'Login fehlgeschlagen'; return; } window.location.assign('/app'); } catch(err) { errorEl.textContent = 'Verbindung zum Server fehlgeschlagen'; } finally { submitBtn.disabled = false; submitBtn.textContent='Einloggen'; }});</script></body></html>
